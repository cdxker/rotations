services:
  postgres:
    image: postgres:16
    container_name: graph-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graph
    volumes:
      - graph-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: phone-radio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  graph-postgres-data:
